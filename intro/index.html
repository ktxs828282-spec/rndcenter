<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Popup Banner</title>

  <style>
    :root {
      --scrim: #282828;
      --modal-bg: #ffffff;
      --desktop-scale: 1;
      --enter-duration: 650ms;
      --close-duration: 300ms;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--scrim);
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button {
      font: inherit;
    }

    .popup-page {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
      background: var(--scrim);
      transition: opacity 180ms ease;
    }

    .desktop-view,
    .mobile-view {
      position: absolute;
      inset: 0;
    }

    /*
      데스크톱 팝업 전체 영역을 화면 정중앙에 배치합니다.

      top: 50%;
      left: 50%;
      translate(-50%, -50%)

      위 조합으로 가로·세로 중앙 정렬합니다.
      scale 또한 중앙을 기준으로 적용됩니다.
    */
    .desktop-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1660px;
      transform: translate(-50%, -50%) scale(var(--desktop-scale));
      transform-origin: center center;
    }

    .desktop-popup-row {
      display: grid;
      grid-template-columns: repeat(4, 400px);
      gap: 20px;
      width: 1660px;
    }

    .popup-slot {
      width: 400px;
      min-height: 692px;
    }

    /*
      AOS가 이 요소에 aos-animate 클래스를 붙입니다.
      모든 카드의 delay가 0이므로 4개가 동시에 실행됩니다.
      외부 AOS CSS가 차단돼도 커스텀 스타일이 유지됩니다.
    */
    [data-aos="popup-zoom"] {
      opacity: 0;
      transform: scale(0.72);
      transform-origin: center center;
      transition-property: opacity, transform;
      transition-duration: var(--enter-duration);
      transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    [data-aos="popup-zoom"].aos-animate {
      opacity: 1;
      transform: scale(1);
    }

    .popup-card {
      width: 400px;
      overflow: hidden;
      background: var(--modal-bg);
    }

    /* 클릭한 카드에만 닫기 애니메이션 적용 */
    .popup-card.is-closing {
      opacity: 0 !important;
      transform: scale(0.84) !important;
      pointer-events: none;
      transition-property: opacity, transform !important;
      transition-duration: var(--close-duration) !important;
      transition-timing-function: cubic-bezier(0.4, 0, 1, 1) !important;
    }

    .popup-header {
      position: relative;
      width: 100%;
      height: 60px;
      overflow: hidden;
      background: #ffffff;
    }

    .brand-logo {
      position: absolute;
      top: 14px;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 128px;
      height: 32px;
      transform: translateX(-50%);
      color: #151e32;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 18px;
      font-weight: 900;
      line-height: 32px;
      letter-spacing: -1.15px;
      white-space: nowrap;
    }

    .close-button {
      position: absolute;
      top: 50%;
      right: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 12px;
      transform: translateY(-50%);
      background: transparent;
      cursor: pointer;
      transition: background-color 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .close-button:hover {
      background: #f2f4f7;
    }

    .close-icon {
      position: relative;
      display: block;
      width: 14px;
      height: 14px;
      transform: rotate(0deg);
      transform-origin: center;
      transition: transform 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .close-button:hover .close-icon {
      transform: rotate(360deg);
    }

    .close-icon::before,
    .close-icon::after {
      position: absolute;
      top: 6px;
      left: 0;
      width: 14px;
      height: 1.5px;
      border-radius: 2px;
      background: #303b50;
      content: "";
    }

    .close-icon::before {
      transform: rotate(45deg);
    }

    .close-icon::after {
      transform: rotate(-45deg);
    }

    .popup-content {
      width: 100%;
      height: 560px;
      background-color: #f7f7f7;
      background-image:
        linear-gradient(45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(-45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e9e9e9 75%),
        linear-gradient(-45deg, transparent 75%, #e9e9e9 75%);
      background-position:
        0 0,
        0 35px,
        35px -35px,
        -35px 0;
      background-size: 70px 70px;
    }

    .popup-footer {
      position: relative;
      width: 100%;
      height: 72px;
      overflow: hidden;
      background: #ffffff;
    }

    .hide-today-button {
      position: absolute;
      top: 50%;
      left: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 148px;
      height: 32px;
      padding: 7px 12px;
      overflow: hidden;
      border: 1px solid #4cc4f9;
      border-radius: 12px;
      transform: translate(-50%, -50%);
      color: #ffffff;
      background-image:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.6) 19.048%,
          rgba(255, 255, 255, 0) 32.738%
        ),
        linear-gradient(
          90deg,
          #38bdf8 6.6372%,
          #2dd4bf 38.673%,
          #34d399 61.327%,
          #84cc16 106.64%
        );
      font-size: 14px;
      line-height: 18px;
      white-space: nowrap;
      cursor: pointer;
      transition:
        filter 160ms ease,
        transform 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .hide-today-button:hover {
      filter: brightness(1.04);
      transform: translate(-50%, -50%) scale(1.02);
    }

    .close-button:focus-visible,
    .hide-today-button:focus-visible {
      outline: 2px solid #1e9fe1;
      outline-offset: 2px;
    }

    .mobile-view {
      display: none;
    }

    .mobile-popup-wrap {
      position: absolute;
      top: 117px;
      left: 50%;
      width: min(396px, calc(100vw - 32px));
      min-height: 692px;
      transform: translateX(-50%);
    }

    .mobile-popup-wrap .popup-card,
    .mobile-popup-wrap .popup-slot {
      width: 100%;
    }

    .popup-page.is-empty {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 767px) {
      body {
        overflow-y: auto;
      }

      .popup-page {
        min-height: 926px;
      }

      .desktop-view {
        display: none;
      }

      .mobile-view {
        display: block;
      }
    }

    @media (max-width: 389px) {
      .mobile-popup-wrap {
        top: 72px;
      }

      .popup-page {
        min-height: 856px;
      }
    }
  </style>
</head>

<body>
  <main
    class="popup-page"
    id="popupPage"
    aria-label="팝업 배너 예시"
  >
    <section
      class="desktop-view"
      aria-label="데스크톱 팝업 배너"
    >
      <div
        class="desktop-stage"
        id="desktopStage"
      >
        <div
          class="desktop-popup-row"
          id="desktopPopupRow"
        ></div>
      </div>
    </section>

    <section
      class="mobile-view"
      aria-label="모바일 팝업 배너"
    >
      <div
        class="mobile-popup-wrap"
        id="mobilePopupWrap"
      ></div>
    </section>
  </main>

  <template id="popupTemplate">
    <article
      class="popup-card"
      data-aos="popup-zoom"
      data-aos-delay="0"
      data-aos-duration="650"
      data-aos-easing="ease-out-cubic"
      data-aos-once="true"
      data-aos-offset="0"
    >
      <header class="popup-header">
        <div
          class="brand-logo"
          aria-label="Sample"
        >
          SAMPLE
        </div>

        <button
          class="close-button"
          type="button"
          aria-label="팝업 닫기"
        >
          <span
            class="close-icon"
            aria-hidden="true"
          ></span>
        </button>
      </header>

      <div
        class="popup-content"
        aria-hidden="true"
      ></div>

      <footer class="popup-footer">
        <button
          class="hide-today-button"
          type="button"
        >
          오늘 하루 열지 않기
        </button>
      </footer>
    </article>
  </template>

  <!--
    AOS 2.3.4를 비동기로 불러옵니다.
    CDN이 느려도 아래 애플리케이션 실행을 막지 않습니다.
  -->
  <script>
    window.__popupAosLibraryLoaded = false;
  </script>

  <script
    async
    src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"
    onload="window.__popupAosLibraryLoaded=true;document.dispatchEvent(new Event('popup:aos-library-ready'))"
    onerror="document.dispatchEvent(new Event('popup:aos-library-error'))"
  ></script>

  <script>
    (() => {
      "use strict";

      const POPUP_IDS = [
        "popup-1",
        "popup-2",
        "popup-3",
        "popup-4"
      ];

      const STORAGE_NAMESPACE = "figmaPopupBanner:v10:";

      /*
        데스크톱 팝업 원본 크기

        카드 4개:
        400px × 4 = 1600px

        카드 간격:
        20px × 3 = 60px

        전체 너비:
        1660px

        전체 높이:
        header 60px + content 560px + footer 72px
        = 692px
      */
      const DESKTOP_CONTENT_WIDTH = 1660;
      const DESKTOP_CONTENT_HEIGHT = 692;

      /*
        화면 가장자리와 팝업 사이에 확보할 최소 여백입니다.

        좌우 총 여백 40px
        상하 총 여백 40px
      */
      const DESKTOP_SIDE_PADDING = 40;
      const DESKTOP_VERTICAL_PADDING = 40;

      const CLOSE_DURATION = 300;

      const sessionClosedIds = new Set();

      let aosInitialized = false;
      let fallbackEntryStarted = false;

      const dom = {
        page: document.querySelector("#popupPage"),
        desktopStage: document.querySelector("#desktopStage"),
        desktopRow: document.querySelector("#desktopPopupRow"),
        mobileWrap: document.querySelector("#mobilePopupWrap"),
        template: document.querySelector("#popupTemplate")
      };

      /*
        두 번의 requestAnimationFrame 이후 실행합니다.

        초기 opacity와 scale 값이 브라우저에 먼저 그려진 뒤
        애니메이션이 시작되도록 하기 위한 함수입니다.
      */
      const nextFrame = () => {
        return new Promise((resolve) => {
          requestAnimationFrame(() => {
            requestAnimationFrame(resolve);
          });
        });
      };

      const getToday = () => {
        const now = new Date();

        return [
          now.getFullYear(),
          String(now.getMonth() + 1).padStart(2, "0"),
          String(now.getDate()).padStart(2, "0")
        ].join("-");
      };

      const storageKey = (popupId) => {
        return `${STORAGE_NAMESPACE}${popupId}`;
      };

      const isDismissedToday = (popupId) => {
        try {
          return localStorage.getItem(storageKey(popupId)) === getToday();
        } catch (_) {
          return false;
        }
      };

      const saveDismissedToday = (popupId) => {
        try {
          localStorage.setItem(
            storageKey(popupId),
            getToday()
          );
        } catch (_) {
          /*
            file:// 환경이나 개인정보 보호 모드에서
            localStorage 접근이 차단되더라도 닫기는 동작합니다.
          */
        }
      };

      const availablePopupIds = () => {
        return POPUP_IDS.filter((popupId) => {
          return (
            !sessionClosedIds.has(popupId) &&
            !isDismissedToday(popupId)
          );
        });
      };

      /*
        화면의 가로·세로 크기를 모두 계산하여
        팝업 전체가 화면 안에 들어오도록 scale 값을 설정합니다.

        가로 기준 배율과 세로 기준 배율 중
        더 작은 값을 사용합니다.

        원본 크기보다 확대되지는 않도록 최대값은 1입니다.
      */
      const fitDesktop = () => {
        const availableWidth = Math.max(
          window.innerWidth - DESKTOP_SIDE_PADDING,
          320
        );

        const availableHeight = Math.max(
          window.innerHeight - DESKTOP_VERTICAL_PADDING,
          320
        );

        const widthScale =
          availableWidth / DESKTOP_CONTENT_WIDTH;

        const heightScale =
          availableHeight / DESKTOP_CONTENT_HEIGHT;

        const scale = Math.min(
          1,
          widthScale,
          heightScale
        );

        dom.desktopStage.style.setProperty(
          "--desktop-scale",
          scale.toFixed(4)
        );
      };

      const createPopup = (popupId) => {
        const popup =
          dom.template.content.firstElementChild.cloneNode(true);

        popup.dataset.popupId = popupId;

        popup
          .querySelector(".close-button")
          .addEventListener("click", () => {
            closePopup(popup, false);
          });

        popup
          .querySelector(".hide-today-button")
          .addEventListener("click", () => {
            closePopup(popup, true);
          });

        return popup;
      };

      const createSlot = (popupId) => {
        const slot = document.createElement("div");

        slot.className = "popup-slot";
        slot.dataset.popupSlot = popupId;
        slot.appendChild(createPopup(popupId));

        return slot;
      };

      const removeCopiesWithoutAnimation = (
        popupId,
        exceptPopup
      ) => {
        document
          .querySelectorAll(
            `.popup-card[data-popup-id="${popupId}"]`
          )
          .forEach((copy) => {
            if (copy === exceptPopup) {
              return;
            }

            const slot = copy.closest(".popup-slot");

            copy.remove();

            if (
              slot &&
              slot.closest("#mobilePopupWrap")
            ) {
              slot.remove();
            }
          });
      };

      const animateNewMobilePopup = async (popup) => {
        await nextFrame();

        if (
          window.AOS &&
          typeof window.AOS.refreshHard === "function"
        ) {
          window.AOS.refreshHard();
          return;
        }

        /*
          CDN이 차단된 환경에서도 동일한 클래스 규칙으로
          애니메이션이 동작하도록 처리합니다.
        */
        popup.classList.add("aos-init");

        requestAnimationFrame(() => {
          popup.classList.add("aos-animate");
        });
      };

      const renderNextMobilePopup = async () => {
        if (
          dom.mobileWrap.querySelector(".popup-card")
        ) {
          return;
        }

        const nextPopupId = availablePopupIds()[0];

        if (!nextPopupId) {
          return;
        }

        const slot = createSlot(nextPopupId);
        const popup =
          slot.querySelector(".popup-card");

        dom.mobileWrap.appendChild(slot);

        await animateNewMobilePopup(popup);
      };

      const updateEmptyState = () => {
        dom.page.classList.toggle(
          "is-empty",
          availablePopupIds().length === 0
        );
      };

      const finishClose = async (
        popup,
        popupId
      ) => {
        const slot =
          popup.closest(".popup-slot");

        popup.remove();

        removeCopiesWithoutAnimation(
          popupId,
          popup
        );

        if (
          slot &&
          slot.closest("#mobilePopupWrap")
        ) {
          slot.remove();
        }

        await renderNextMobilePopup();

        updateEmptyState();

        if (
          window.AOS &&
          typeof window.AOS.refreshHard === "function"
        ) {
          window.AOS.refreshHard();
        }
      };

      const closePopup = (
        popup,
        dismissToday
      ) => {
        if (
          !popup ||
          popup.classList.contains("is-closing")
        ) {
          return;
        }

        const popupId =
          popup.dataset.popupId;

        if (
          !popupId ||
          sessionClosedIds.has(popupId)
        ) {
          return;
        }

        if (dismissToday) {
          saveDismissedToday(popupId);
        }

        sessionClosedIds.add(popupId);

        /*
          클릭한 모달 하나에만
          fade-out + zoom-out 애니메이션을 적용합니다.
        */
        popup.classList.add("is-closing");

        let completed = false;

        const complete = () => {
          if (completed) {
            return;
          }

          completed = true;

          finishClose(
            popup,
            popupId
          );
        };

        popup.addEventListener(
          "transitionend",
          (event) => {
            if (
              event.target === popup &&
              event.propertyName === "opacity"
            ) {
              complete();
            }
          },
          {
            once: true
          }
        );

        window.setTimeout(
          complete,
          CLOSE_DURATION + 80
        );
      };

      const renderInitialPopups = () => {
        const ids = availablePopupIds();

        ids.forEach((popupId) => {
          /*
            모든 카드의 delay가 0이므로
            같은 프레임에서 동시에 애니메이션이 실행됩니다.
          */
          dom.desktopRow.appendChild(
            createSlot(popupId)
          );
        });

        if (ids[0]) {
          dom.mobileWrap.appendChild(
            createSlot(ids[0])
          );
        }

        updateEmptyState();
      };

      const initializeRealAos = () => {
        if (
          aosInitialized ||
          !window.AOS ||
          typeof window.AOS.init !== "function"
        ) {
          return false;
        }

        window.AOS.init({
          offset: 0,
          delay: 0,
          duration: 650,
          easing: "ease-out-cubic",
          once: true,
          mirror: false,
          disable: false
        });

        aosInitialized = true;

        return true;
      };

      const startFallbackEntry = () => {
        if (fallbackEntryStarted) {
          return;
        }

        fallbackEntryStarted = true;

        const elements =
          document.querySelectorAll(
            '[data-aos="popup-zoom"]'
          );

        elements.forEach((element) => {
          element.classList.add("aos-init");
        });

        requestAnimationFrame(() => {
          elements.forEach((element) => {
            element.classList.add("aos-animate");
          });
        });
      };

      const startAos = async () => {
        /*
          opacity: 0과 scale 상태가 브라우저에 먼저 그려진 뒤
          진입 애니메이션을 시작합니다.
        */
        await nextFrame();

        if (!initializeRealAos()) {
          /*
            CDN 로딩 여부와 상관없이
            로컬 HTML 미리보기에서도 즉시 동작합니다.
          */
          startFallbackEntry();
        }
      };

      document.addEventListener(
        "popup:aos-library-ready",
        () => {
          if (
            initializeRealAos() &&
            window.AOS &&
            typeof window.AOS.refreshHard === "function"
          ) {
            window.AOS.refreshHard();
          }
        }
      );

      const init = async () => {
        /*
          팝업 렌더링 전에 먼저 화면 크기에 맞는
          데스크톱 scale 값을 계산합니다.
        */
        fitDesktop();

        renderInitialPopups();

        await startAos();

        window.addEventListener(
          "resize",
          () => {
            fitDesktop();

            if (
              window.AOS &&
              typeof window.AOS.refresh === "function"
            ) {
              window.AOS.refresh();
            }
          },
          {
            passive: true
          }
        );
      };

      /*
        브라우저 콘솔에서 아래 함수를 실행하면
        오늘 하루 보지 않기 기록이 초기화됩니다.

        resetPopupBanner()
      */
      window.resetPopupBanner = () => {
        try {
          POPUP_IDS.forEach((popupId) => {
            localStorage.removeItem(
              storageKey(popupId)
            );
          });
        } catch (_) {
          /*
            저장소 접근이 막힌 환경에서는 무시합니다.
          */
        }

        location.reload();
      };

      init();
    })();
  </script>
</body>
</html>
